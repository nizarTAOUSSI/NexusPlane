name: Deploy NexusPlan to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connexion SSH et Déploiement
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # ── 1. Pull main monorepo (backend, frontend, nginx, …) ───────────
            cd ~/NexusPlane
            git pull origin main

            # ── 2. Pull chat service — branch: nizar ──────────────────────────
            cd ~/NexusPlane/chat
            git fetch origin
            git checkout nizar
            git pull origin nizar

            # ── 3. Rebuild & restart all Docker services ──────────────────────
            cd ~/NexusPlane/nexusplan-backend
            docker compose up --build -d

            # ── 4. Clean up dangling images ───────────────────────────────────
            docker image prune -f