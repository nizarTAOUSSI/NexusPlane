events {
    worker_connections 1024;
}

http {
    upstream chat_upstream {
        ip_hash;
        server chat_service:5000;
    }

    server {
        listen 80;
        server_name nexusplane.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name nexusplane.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/nexusplane.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nexusplane.duckdns.org/privkey.pem;

        # ── Auth ─────────────────────────────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://auth_service:8000/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Projects / Memberships / Teams ───────────────────────────────────
        location /api/projects/ {
            proxy_pass http://project_service:8000/api/projects/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/memberships/ {
            proxy_pass http://project_service:8000/api/memberships/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/teams/ {
            proxy_pass http://project_service:8000/api/teams/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Tasks ─────────────────────────────────────────────────────────────
        location /api/tasks/ {
            proxy_pass http://task_service:8000/api/tasks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── AI ────────────────────────────────────────────────────────────────
        location /api/ai/ {
            proxy_pass http://ai_service:8000/api/ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Messages REST API (stored DMs, group messages, notifications) ─────
        location /api/messages/ {
            proxy_pass http://auth_service:8000/api/messages/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Socket.IO (chat service) ──────────────────────────────────────────
        # Handles both WebSocket upgrade and long-polling HTTP requests
        location /socket.io/ {
            proxy_pass http://chat_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            # Keepalive for long-polling fallback
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # ── Django Channels WebSocket (Kanban real-time) ──────────────────────
        location /ws/ {
            proxy_pass http://realtime_service:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ── Swagger docs ──────────────────────────────────────────────────────
        location = /docs/ {
            root /usr/share/nginx/html;
            try_files /swagger.html =404;
        }

        location /docs/schema/auth/ {
            proxy_pass http://auth_service:8000/api/schema/;
            proxy_set_header Host $host;
        }
        location /docs/schema/projects/ {
            proxy_pass http://project_service:8000/api/schema/;
            proxy_set_header Host $host;
        }
        location /docs/schema/tasks/ {
            proxy_pass http://task_service:8000/api/schema/;
            proxy_set_header Host $host;
        }
        location /docs/schema/ai/ {
            proxy_pass http://ai_service:8000/api/schema/;
            proxy_set_header Host $host;
        }
        location /docs/schema/realtime/ {
            proxy_pass http://realtime_service:8000/api/schema/;
            proxy_set_header Host $host;
        }

        # ── Frontend (catch-all) ──────────────────────────────────────────────
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}