services:
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - nexus_network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - nexus_network

  frontend:
    build:
      context: ../nexusplan-frontend
    networks:
      - nexus_network

  chat_service:
    build:
      context: ../chat
    restart: always
    env_file:
      - .env
    environment:
      - PORT=5000
      - DJANGO_URL=http://auth_service:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      - auth_service
    networks:
      - nexus_network

  api_gateway:
    build:
      context: ./api_gateway
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth_service
      - project_service
      - task_service
      - ai_service
      - realtime_service
      - chat_service
      - frontend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - nexus_network

  auth_service:
    build:
      context: ./auth_service
    command: >
      sh -c "until python manage.py migrate users 0002_add_messaging_models --fake 2>/dev/null; do
               echo '[auth] DB not ready, retrying in 3s...'; sleep 3;
             done &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./auth_service:/app
    env_file:
      - .env
    environment:
      - SECRET_KEY=${AUTH_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - db
      - redis
    networks:
      - nexus_network

  project_service:
    build:
      context: ./project_service
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./project_service:/app
    env_file:
      - .env
    environment:
      - SECRET_KEY=${PROJECT_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - db
      - redis
    networks:
      - nexus_network

  task_service:
    build:
      context: ./task_service
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./task_service:/app
    env_file:
      - .env
    environment:
      - SECRET_KEY=${TASK_SECRET_KEY}
      - DATABASE_URL=${TASK_DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - db
      - redis
    networks:
      - nexus_network

  ai_service:
    build:
      context: ./ai_service
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./ai_service:/app
    env_file:
      - .env
    environment:
      - SECRET_KEY=${AI_SECRET_KEY}
      - DATABASE_URL=${AI_DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
    depends_on:
      - db
      - redis
    networks:
      - nexus_network

  realtime_service:
    build:
      context: ./realtime_service
    command: daphne -b 0.0.0.0 -p 8000 realtime_service.asgi:application
    volumes:
      - ./realtime_service:/app
    env_file:
      - .env
    environment:
      - SECRET_KEY=${REALTIME_SECRET_KEY}
      - AUTH_JWT_SECRET_KEY=${AUTH_SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - db
      - redis
    networks:
      - nexus_network

volumes:
  postgres_data:

networks:
  nexus_network:
    driver: bridge