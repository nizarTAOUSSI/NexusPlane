<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/png" href="/logoNexus.png" />
    <script>
      (function () {
        function applyFavicon(dark) {
          var img = new Image();
          img.src = '/logoNexus.png';
          img.onload = function () {
            var canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            if (dark) {
              ctx.filter = 'invert(1)';
              ctx.drawImage(img, 0, 0);
            }
            document.getElementById('favicon').href = canvas.toDataURL('image/png');
          };
        }
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        applyFavicon(mq.matches);
        mq.addEventListener('change', function (e) { applyFavicon(e.matches); });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NexusPlan — The first AI-powered real-time collaborative platform." />
    <title>NexusPlan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
