<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realtime Chat Test</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white w-[500px] shadow-xl rounded-xl p-5">

    <h1 class="text-2xl font-bold mb-4 text-center">Realtime Chat</h1>

    <!-- LOGIN DATA -->
    <div class="space-y-2 mb-4">
        <input id="userId" placeholder="Your User ID"
            class="w-full border p-2 rounded">

        <input id="token" placeholder="Your Token"
            class="w-full border p-2 rounded">

        <input id="receiverId" placeholder="Receiver ID"
            class="w-full border p-2 rounded">

        <button onclick="connectUser()"
            class="w-full bg-green-500 text-white p-2 rounded">
            Connect
        </button>
    </div>

    <!-- CHAT BOX -->
    <div id="chatBox" class="h-72 overflow-y-auto border rounded p-3 mb-3 bg-gray-50"></div>

    <!-- SEND MESSAGE -->
    <div class="flex gap-2">
        <input id="messageInput" placeholder="Type message..."
            class="flex-1 border p-2 rounded">

        <button onclick="sendMessage()"
            class="bg-blue-500 text-white px-4 rounded">
            Send
        </button>
    </div>

</div>

<script>

let socket;
let myId;
let receiverId;

function connectUser() {

    myId = document.getElementById("userId").value;
    const token = document.getElementById("token").value;
    receiverId = document.getElementById("receiverId").value;

    // 🔥 IMPORTANT : wss (production)
    socket = io("https://chat-production-0a72.up.railway.app", {
        transports: ["websocket"]
    });

    socket.on("connect", () => {
        console.log("Connected to socket");

        const room = [myId, receiverId].sort().join("_");

        socket.emit("joinRoom", room);
        socket.emit("userOnline", { userId: myId, token });

        addMessage("SYSTEM", "Connected to room " + room);
    });

    socket.on("receiveMessage", (data) => {
        addMessage(data.senderId, data.message);
    });
}

function sendMessage() {

    const message = document.getElementById("messageInput").value;
    if (!message) return;

    const room = [myId, receiverId].sort().join("_");

    socket.emit("sendMessage", {
        room,
        message,
        senderId: myId,
        receiverId
    });

    addMessage("ME", message);
    document.getElementById("messageInput").value = "";
}

function addMessage(sender, text) {
    const box = document.getElementById("chatBox");

    const div = document.createElement("div");
    div.className = "mb-2";

    div.innerHTML = `<b>${sender}:</b> ${text}`;
    box.appendChild(div);

    box.scrollTop = box.scrollHeight;
}

</script>
</body>
</html>
